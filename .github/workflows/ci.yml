name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Test
        run: go test ./internal/... ./cmd/... -count=1
      - name: Race detector (Linux only)
        if: runner.os == 'Linux'
        run: go test -race ./internal/nup/ ./internal/nsp/ ./internal/nuptools/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Cross-compile sanity: the format code must stay portable
      - run: go build ./...
        env:
          GOOS: linux
          GOARCH: arm64

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l internal cmd)" || (gofmt -l internal cmd && exit 1)
