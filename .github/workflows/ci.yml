name: CI

on:
  push:
    branches: [main, 'cursor/**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check (build + vet + gofmt + tests)
        run: make check
      - name: Race detector
        run: make race

  golden:
    # STRICT byte-exactness validation against the pinned Python reference.
    name: golden (byte-exactness vs Python reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Checkout reference implementation (pinned)
        uses: actions/checkout@v4
        with:
          repository: smarkyie/NSP-Box
          ref: c3de7a120cb4b3c86cd5b5bcdbf5f33bbffe0fc0
          path: nsp-box-src
      - name: Set up Python reference env
        run: |
          python3 -m venv .pyref-venv
          .pyref-venv/bin/pip install --disable-pip-version-check 'Pillow==12.2.0' 'zstandard==0.25.0'
      - name: Run golden tests (strict)
        env:
          NSPBOX_PYTHON: ${{ github.workspace }}/.pyref-venv/bin/python
          NSPBOX_PYREF: ${{ github.workspace }}/nsp-box-src/src
          NSPBOX_REQUIRE_PYREF: "1"
        run: make golden

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Native tests, including the ReplaceFileW in-place replacement and
      # its simulated partial failures (internal/nup/replace_windows_test.go)
      - name: Tests
        run: go test ./internal/... ./cmd/... -count=1
      - name: In-place replacement tests (verbose)
        run: go test ./internal/nup/ -run 'ReplaceFile|InPlace' -count=1 -v
      # Cross-compile sanity: the format code must stay portable
      - run: go build ./...
        env:
          GOOS: linux
          GOARCH: arm64
